<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новогодние Корпоративы | Банкет Холл «Крендель»</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* TILDA PREMIUM NEW YEAR STYLING */
        :root {
            --bg-dark: #0A0D14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-gold: #E2C082;
            --accent-glow: rgba(226, 192, 130, 0.25);
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Full Screen Cover (100vh) */
        .hero-fullscreen {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Glassmorphism Card Style like Tilda Zero Block */
        .tilda-glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tilda-glass-card:hover {
            border-color: rgba(226, 192, 130, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px var(--accent-glow);
        }

        /* Tilda Gold Button */
        .btn-tilda-gold {
            background: linear-gradient(135deg, #E2C082 0%, #C49A50 100%);
            color: #000;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-tilda-gold:hover {
            box-shadow: 0 0 25px var(--accent-glow);
            transform: scale(1.02);
        }

        /* Language Switcher Button */
        .lang-btn {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #9CA3AF;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .lang-btn.active {
            background: rgba(226, 192, 130, 0.2);
            color: #E2C082;
            border: 1px solid rgba(226, 192, 130, 0.4);
        }

        /* Canvas for Snow effect */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 2;
        }

        /* Glow Elements */
        .bg-glow-1 {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(226, 192, 130, 0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }

        /* ИЛЛЮСТРАЦИЯ ДЕДА МОРОЗА И ЕЛОК ВНИЗУ */
        .bottom-illustration-container {
            position: relative;
            width: 100%;
            padding-top: 40px;
            overflow: hidden;
            background: linear-gradient(to bottom, transparent 0%, rgba(14, 20, 32, 0.8) 100%);
        }

        .santa-flying {
            position: absolute;
            right: 5%;
            top: 10px;
            width: 160px;
            opacity: 0.85;
            filter: drop-shadow(0 0 10px rgba(226, 192, 130, 0.3));
        }

        @media (min-width: 768px) {
            .santa-flying {
                width: 280px;
                right: 12%;
                top: 0px;
            }
        }
    </style>
</head>
<body class="antialiased">

    <!-- CANVAS СНЕГОПАД -->
    <canvas id="snow-canvas"></canvas>
    
    <!-- ФОНОВЫЙ ГРАДИЕНТНЫЙ БЛИК -->
    <div class="bg-glow-1"></div>

    <div class="content-layer">
        
        <!-- FIRST SCREEN / FULLSCREEN COVER (100vh) -->
        <section class="hero-fullscreen max-w-6xl mx-auto px-6 py-6 md:py-10">
            
            <!-- NAVBAR С ПЕРЕКЛЮЧАТЕЛЕМ ЯЗЫКОВ -->
            <header class="flex justify-between items-center w-full border-b border-white/10 pb-5">
                <div class="flex items-center gap-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#E2C082] animate-pulse"></span>
                    <span class="text-xs font-semibold tracking-[0.2em] text-gray-300 uppercase">БАНКЕТ ХОЛЛ «КРЕНДЕЛЬ»</span>
                </div>
                
                <!-- ЯЗЫКОВОЙ ПЕРЕКЛЮЧАТЕЛЬ (KZ | RU | EN) -->
                <div class="flex items-center gap-1 bg-white/5 p-1 rounded-lg border border-white/10">
                    <button onclick="setLanguage('kz')" id="lang-kz" class="lang-btn">KZ</button>
                    <button onclick="setLanguage('ru')" id="lang-ru" class="lang-btn active">RU</button>
                    <button onclick="setLanguage('en')" id="lang-en" class="lang-btn">EN</button>
                </div>
            </header>

            <!-- MAIN HERO CONTENT -->
            <div class="my-auto py-8">
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full tilda-glass-card text-xs text-[#E2C082] mb-6">
                    <i class="fa-regular fa-snowflake"></i>
                    <span id="txt-badge" class="tracking-widest uppercase text-[11px] font-medium">Праздничное шоу & Розыгрыш подарков</span>
                </div>

                <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight leading-[1.1] mb-6">
                    <span id="txt-hero-title">Новогодние Корпоративы</span> <br>
                    <span id="txt-hero-location" class="text-transparent bg-clip-text bg-gradient-to-r from-[#E2C082] via-[#FFF0D4] to-[#C49A50]">
                        в Банкет Холле «Крендель»
                    </span>
                </h1>

                <p id="txt-hero-desc" class="text-gray-400 text-sm md:text-base max-w-2xl font-light leading-relaxed mb-8">
                    Ведущие вечера — дуэт <strong class="text-white font-semibold">АДАЙ и АЗАТ</strong>. Грандиозная концертная программа, розыгрыш новогодних подарков и атмосфера настоящего праздника!
                </p>

                <!-- DESKTOP / MOBILE GRID CARDS -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-3xl mb-8">
                    <!-- Card 1: Ведущие -->
                    <div class="tilda-glass-card p-4 rounded-2xl flex items-center gap-4">
                        <img src="aday.jpg" alt
